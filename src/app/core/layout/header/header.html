<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Nurudeen Bada, home">
      <span aria-hidden="true">NB</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <nav id="primary-navigation" aria-label="Primary navigation" [class.is-open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/experience" routerLinkActive="active" (click)="closeMenu()">Experience</a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
    </nav>
  </div>
</header>
